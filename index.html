<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CanvasVault</title>
    <!--
      Excalidraw uses window.EXCALIDRAW_EXPORT_SOURCE (or falls back to window.location.origin)
      when serializing scenes to JSON. Setting this to 'https://excalidraw.com' guarantees
      that exported and saved .excalidraw files match the official Excalidraw file format specification.
    -->
    <script>
      window.EXCALIDRAW_EXPORT_SOURCE = 'https://excalidraw.com';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
